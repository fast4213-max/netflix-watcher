name: Netflix Watcher Dispatch

# 重要: schedule (GitHub純正cron) はここでは使わない。
# 実行時刻の精度が数分〜十数分ずれることがあるため、
# 正確な時刻起動は cron-job.org からこの workflow_dispatch を
# GitHub REST API 経由で叩くことで実現する。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: true
        default: "run"
        type: choice
        options:
          - run
          - init
          - test

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run watcher script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MODE: ${{ github.event.inputs.mode }}
        run: node src/index.js

      - name: Commit updated state (data/state.json)
        run: |
          git config user.name "netflix-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "state.jsonに変更なし。コミットをスキップします。"
          else
            git commit -m "chore: update state.json [skip ci] ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git push
          fi
